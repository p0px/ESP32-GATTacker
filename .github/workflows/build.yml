name: Build

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  web:
    name: Web UI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Build packaged UI
        run: |
          cd UI
          npm ci
          npm run build
          cd ..
          python3 scripts/check_packaged_ui.py

  firmware:
    name: ESP32-S3 firmware
    needs: web
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      # ESP-IDF v5.5.2
      image: espressif/idf@sha256:05cbfc42ed2e987b8026722c15bf1d8523d3e4fd1b4ac04d2e4056f5e0918b99
    env:
      IDF_TARGET: esp32s3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Patch ESP-IDF Bluedroid
        run: git -C "$IDF_PATH" apply "$GITHUB_WORKSPACE/bad_blues.patch"
      - name: Build firmware and merged image
        working-directory: Firmware
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" describe --tags --always --dirty
          . "$IDF_PATH/export.sh" >/dev/null
          idf.py build
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            test -f "build/esp-gattacker-$GITHUB_REF_NAME.bin"
          fi
      - name: Upload firmware
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: firmware-${{ github.sha }}
          path: |
            Firmware/build/esp-gattacker-*.bin
            Firmware/build/gattacker.bin
            Firmware/build/spiffs.bin
          if-no-files-found: error

  release:
    name: GitHub release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: firmware
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # Required only to create the GitHub release.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify release commit is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: firmware-${{ github.sha }}
          path: release
      - name: Publish merged firmware
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release already exists; refusing to overwrite it."
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" release/esp-gattacker-*.bin \
            --generate-notes --verify-tag
